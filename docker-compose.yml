services:
  oddshub:
    build: .
    container_name: oddshub
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - BSD_API_TOKEN=${BSD_API_TOKEN}
      - BSD_BASE_URL=https://sports.bzzoiro.com/api/v2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s